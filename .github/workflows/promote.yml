# Promote a release after manual verification (policy C, docs/ci.md):
# clears the pre-release flag and sets the notes' Status line to FULLY TESTED.
# A minor/major release must carry the maintainer run's result file
# (openclip-test-<tag>.json, `gh release upload <tag> openclip-test-<tag>.json`):
# the gate refuses unless it is for this tag and commit, full tier, PASS, with
# real Flame clips tested, and adds its verification line. A patch release is
# exempt. The free-text input adds the Flame line. Run by hand:
# Actions -> promote -> Run workflow.
name: promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to promote, e.g. v1.2.0"
        required: true
        type: string
      verification:
        description: 'Optional line to add (the Flame check, docs/FLAME_TEST.md), e.g. "Flame 2027: ✔ 2026-11-02"'
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # edit the release
    steps:
      - name: Check out (for the release script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERIFICATION: ${{ inputs.verification }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/promote"; mkdir -p "$D"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::tag $TAG is not vX.Y.Z"; exit 1; fi
          gh api --paginate "repos/$REPO/git/matching-refs/tags/v" --jq '.[].ref | sub("^refs/tags/"; "")' > "$D/tags"
          # The commit the tag points to (an annotated tag is one more hop).
          ref_json=$(gh api "repos/$REPO/git/ref/tags/$TAG")
          tag_sha=$(jq -r .object.sha <<<"$ref_json")
          if [ "$(jq -r .object.type <<<"$ref_json")" = tag ]; then
            tag_sha=$(gh api "repos/$REPO/git/tags/$tag_sha" --jq .object.sha)
          fi
          # The result file, if uploaded; the gate decides whether it is needed.
          result="openclip-test-$TAG.json"
          gh release download "$TAG" --repo "$REPO" --pattern "$result" --dir "$D" || true
          python3 .github/scripts/release_plan.py gate --tag "$TAG" --tags-file "$D/tags" \
            --tag-commit "$tag_sha" --result-file "$D/$result" --line-out "$D/line"

          gh release view "$TAG" --repo "$REPO" --json body --jq .body > "$D/before.md"
          python3 .github/scripts/release_plan.py promote --notes-in "$D/before.md" --notes-out "$D/after.md" \
            --verification "$(cat "$D/line")" --verification "$VERIFICATION"
          gh release edit "$TAG" --repo "$REPO" --prerelease=false --notes-file "$D/after.md"
          { echo "Promoted $TAG"; echo; echo '```diff'; diff "$D/before.md" "$D/after.md" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
