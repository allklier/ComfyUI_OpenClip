[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "comfy-openclip"
version = "0.1.0"
description = "OpenClip read/write nodes for ComfyUI"
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.0",
    "openimageio>=3.0",
    "opencolorio>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
