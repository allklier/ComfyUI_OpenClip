[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-openclip"
version = "0.9.3"
description = "OpenClip read/write nodes for ComfyUI - file exchange with Flame"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
dependencies = [
    "lxml>=5.0",
    "openimageio>=3.0",
    "opencolorio>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/allklier/ComfyUI_OpenClip"

[tool.comfy]
PublisherId = "allklier"
DisplayName = "OpenClip"

[tool.pytest.ini_options]
testpaths = ["tests"]
